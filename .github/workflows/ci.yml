name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff and pytest
        run: pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -q
