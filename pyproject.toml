[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-bootstrapper"
version = "0.2.0"
description = "CLI tool for bootstrapping project structures and dependencies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bootstrapper = "bootstrapper_app:main"

[tool.setuptools]
packages = ["cli", "core", "engine", "templates"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["templates_store"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
